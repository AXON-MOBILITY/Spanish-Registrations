<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DGT Matriculaciones</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0f1e;--bg2:#0f1629;--bg3:#151d35;--card:#1a2340;--card2:#1f2a4a;
  --border:#2a3a5c;--acc:#4f8ef7;--acc2:#00d4aa;--acc3:#f7934f;--acc4:#c084fc;
  --text:#e8eaf6;--text2:#8892b0;--text3:#cdd3e8;
  --priv:#4f8ef7;--corp:#00d4aa;--rac:#f7934f;
  --ice:#8892b0;--bev:#00d4aa;--phev:#c084fc;
  --red:#ff4757;--green:#2ed573;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:13px}
/* --- TOP BAR --- */
#topbar{position:sticky;top:0;z-index:200;background:var(--bg2);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:20px;padding:0 20px;height:52px}
.logo{font-weight:700;font-size:15px;letter-spacing:.3px;white-space:nowrap}
.logo span{color:var(--acc)}
.navs{display:flex;gap:3px;flex:1;overflow-x:auto}
.nb{padding:5px 13px;border-radius:6px;border:none;background:transparent;color:var(--text2);
  cursor:pointer;font-size:12px;font-weight:500;white-space:nowrap;transition:.12s}
.nb:hover{background:var(--bg3);color:var(--text)}
.nb.on{background:var(--acc);color:#fff}
.upd{font-size:11px;color:var(--text2);white-space:nowrap}
/* --- LAYOUT --- */
#shell{display:flex;height:calc(100vh - 52px)}
/* --- SIDEBAR --- */
#sidebar{width:220px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);
  overflow-y:auto;padding:12px 10px 20px;display:flex;flex-direction:column;gap:12px}
.fg{display:flex;flex-direction:column;gap:4px}
.fl{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.9px;padding:0 2px}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:3px}
.chip{padding:3px 9px;border-radius:20px;border:1px solid var(--border);background:transparent;
  color:var(--text2);cursor:pointer;font-size:11px;font-weight:500;transition:.12s}
.chip:hover{border-color:var(--acc);color:var(--acc)}
.chip.on{border-color:var(--acc);background:var(--acc);color:#fff}
.chip.c-corp.on{border-color:var(--corp);background:var(--corp);color:#0a0f1e}
.chip.c-rac.on{border-color:var(--rac);background:var(--rac);color:#0a0f1e}
.chip.c-bev.on{border-color:var(--bev);background:var(--bev);color:#0a0f1e}
.chip.c-phev.on{border-color:var(--phev);background:var(--phev);color:#fff}
.chip.c-ice.on{border-color:var(--ice);background:var(--ice);color:#0a0f1e}
.chip.c-hp.on{border-color:var(--acc3);background:var(--acc3);color:#0a0f1e}
/* search-select */
.ss-wrap{position:relative}
.ss-input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:6px;
  color:var(--text);padding:5px 8px;font-size:11px;outline:none}
.ss-input:focus{border-color:var(--acc)}
.ss-list{max-height:120px;overflow-y:auto;border:1px solid var(--border);border-top:none;
  border-radius:0 0 6px 6px;background:var(--bg3);display:none}
.ss-list.open{display:block}
.ss-opt{padding:4px 8px;cursor:pointer;font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ss-opt:hover,.ss-opt.sel{background:var(--card2)}
.ss-opt.sel{color:var(--acc)}
.ss-badge{font-size:10px;color:var(--acc);margin-top:2px;padding:0 2px}
/* month selects */
.month-row{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.msel{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:6px;
  color:var(--text);padding:4px 6px;font-size:11px;outline:none}
.msel:focus{border-color:var(--acc)}
/* reset */
.reset-btn{padding:6px;border-radius:6px;border:1px solid var(--border);background:transparent;
  color:var(--text2);cursor:pointer;font-size:11px;text-align:center;transition:.12s;margin-top:4px}
.reset-btn:hover{border-color:var(--acc);color:var(--acc)}
.divider{border-top:1px solid var(--border);margin:2px 0}
/* --- CONTENT --- */
#content{flex:1;overflow-y:auto;padding:16px 20px}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:13px 14px}
.kpi-l{font-size:10px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.kpi-v{font-size:24px;font-weight:700;color:var(--text);margin:3px 0 1px;line-height:1}
.kpi-s{font-size:11px;color:var(--text2)}
.kpi-d{font-size:11px;font-weight:600}
.kpi-d.pos{color:var(--green)} .kpi-d.neg{color:var(--red)}
/* chart cards */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.grid31{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:14px}
.cc{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:14px}
.cc-t{font-size:12px;font-weight:600;color:var(--text3);margin-bottom:10px}
.cw{position:relative} .cw canvas{max-height:260px}
/* table */
.tw{background:var(--card);border:1px solid var(--border);border-radius:9px;overflow:hidden;margin-bottom:14px}
.th{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.th-t{font-size:12px;font-weight:600;color:var(--text3)}
.ts{background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);
  padding:4px 9px;font-size:11px;outline:none;width:160px}
.ts:focus{border-color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:11px}
th{padding:7px 10px;text-align:left;color:var(--text2);font-weight:600;font-size:10px;
  text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);
  cursor:pointer;white-space:nowrap;user-select:none}
th:hover{color:var(--text)}
th.asc::after{content:" ▲"} th.desc::after{content:" ▼"}
td{padding:6px 10px;border-bottom:1px solid rgba(42,58,92,.4);color:var(--text3);white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--card2)}
.bar-cell{display:flex;align-items:center;gap:6px}
.bar-track{flex:1;max-width:80px;height:4px;background:var(--bg3);border-radius:2px}
.bar-fill{height:4px;border-radius:2px;background:var(--acc)}
/* loading */
#loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;
  justify-content:center;font-size:14px;color:var(--text2);z-index:999}
.spin{display:inline-block;width:24px;height:24px;border:2px solid var(--border);
  border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite;margin-right:10px}
@keyframes spin{to{transform:rotate(360deg)}}
/* empty */
.empty{padding:40px;text-align:center;color:var(--text2);font-size:13px}
/* segment badges */
.seg-badge{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:600;border:1px solid}
.seg-UKL0{border-color:#6ca8ff;color:#6ca8ff}
.seg-UKL1{border-color:#4f8ef7;color:#4f8ef7}
.seg-UKL2{border-color:#a5c4ff;color:#a5c4ff}
.seg-MKL{border-color:#00d4aa;color:#00d4aa}
.seg-KKL{border-color:#f7934f;color:#f7934f}
.seg-SKL{border-color:#c084fc;color:#c084fc}
.seg-GKL{border-color:#ff6b6b;color:#ff6b6b}
.seg-GKLp{border-color:#ffd700;color:#ffd700}
</style>
</head>
<body>
<div id="loading"><span class="spin"></span>Cargando datos DGT…</div>

<div id="topbar">
  <div class="logo">DGT <span>Matriculaciones</span></div>
  <div class="navs">
    <button class="nb on" onclick="setPage('mercado')">Mercado</button>
    <button class="nb" onclick="setPage('marcas')">Marcas</button>
    <button class="nb" onclick="setPage('segmentos')">Segmentos</button>
    <button class="nb" onclick="setPage('modelos')">Modelos</button>
    <button class="nb" onclick="setPage('provincias')">Provincias</button>
    <button class="nb" onclick="setPage('diario')">MTD Diario</button>
  </div>
  <div class="upd" id="upd-lbl"></div>
</div>

<div id="shell">
<!-- SIDEBAR -->
<div id="sidebar">

  <div class="fg">
    <div class="fl">Año</div>
    <div class="chips" id="f-years"></div>
  </div>

  <div class="fg">
    <div class="fl">Rango mes</div>
    <div class="month-row">
      <select class="msel" id="f-from" onchange="onFilterChange()"><option value="">Desde</option></select>
      <select class="msel" id="f-to" onchange="onFilterChange()"><option value="">Hasta</option></select>
    </div>
  </div>

  <div class="divider"></div>

  <div class="fg">
    <div class="fl">Canal</div>
    <div class="chips" id="f-canales"></div>
  </div>

  <div class="fg">
    <div class="fl">Combustible</div>
    <div class="chips" id="f-fuels"></div>
  </div>

  <div class="divider"></div>

  <div class="fg">
    <div class="fl">Marca <span id="f-marca-badge" class="ss-badge"></span></div>
    <div class="ss-wrap">
      <input class="ss-input" id="f-marca-q" placeholder="Buscar marca…" autocomplete="off"
        oninput="filterSS('marca')" onfocus="openSS('marca')" onblur="blurSS('marca')">
      <div class="ss-list" id="ss-marca-list"></div>
    </div>
  </div>

  <div class="fg">
    <div class="fl">Modelo <span id="f-modelo-badge" class="ss-badge"></span></div>
    <div class="ss-wrap">
      <input class="ss-input" id="f-modelo-q" placeholder="Buscar modelo…" autocomplete="off"
        oninput="filterSS('modelo')" onfocus="openSS('modelo')" onblur="blurSS('modelo')">
      <div class="ss-list" id="ss-modelo-list"></div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="fg">
    <div class="fl">Segmento</div>
    <div class="chips" id="f-segs"></div>
  </div>

  <div class="fg">
    <div class="fl">SubSegmento</div>
    <div class="chips" id="f-subs"></div>
  </div>

  <div class="fg">
    <div class="fl">Body Type</div>
    <div class="chips" id="f-bodies"></div>
  </div>

  <div class="fg">
    <div class="fl">High Performance</div>
    <div class="chips" id="f-hps"></div>
  </div>

  <button class="reset-btn" onclick="resetFilters()">↺ Limpiar filtros</button>
</div>

<!-- CONTENT -->
<div id="content">
  <div id="page-mercado" class="page"></div>
  <div id="page-marcas" class="page" style="display:none"></div>
  <div id="page-segmentos" class="page" style="display:none"></div>
  <div id="page-modelos" class="page" style="display:none"></div>
  <div id="page-provincias" class="page" style="display:none"></div>
  <div id="page-diario" class="page" style="display:none"></div>
</div>
</div>

<script>
// ────────────────────────────────────────────────────
// DATA + STATE
// ────────────────────────────────────────────────────
let REC = null;          // records.json parsed
let PROV = null;         // provinces.json
let DAILY = null;        // daily_mtd.json
let currentPage = 'mercado';

const CANAL_NAMES = ['Private','Corporate','RAC'];
const FUEL_NAMES  = ['ICE','BEV','PHEV'];
const COL = {Y:0,M:1,MARCA:2,MODELO:3,CANAL:4,FUEL:5,SEG:6,SUB:7,HP:8,BODY:9,N:10};
const MONTHS_ES = ['','Enero','Febrero','Marzo','Abril','Mayo','Junio',
                   'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

const SEG_ORDER = ['UKL0','UKL1','UKL2','MKL','KKL','SKL','GKL','GKL+'];

// Filter state — empty Set = all allowed
const F = {
  years:  new Set(), months: new Set(),
  canales: new Set(), fuels: new Set(),
  marcas: new Set(), modelos: new Set(),
  segs: new Set(), subs: new Set(),
  hps: new Set(), bodies: new Set(),
  fromYM: null, toYM: null,  // 'YYYY-MM'
};

// Charts registry
const charts = {};

// ────────────────────────────────────────────────────
// LOAD
// ────────────────────────────────────────────────────
async function load() {
  const [rec, prov, daily, meta] = await Promise.all([
    fetch('data/records.json').then(r=>r.json()),
    fetch('data/provinces.json').then(r=>r.json()),
    fetch('data/daily_mtd.json').then(r=>r.json()),
    fetch('data/meta.json').then(r=>r.json()),
  ]);
  REC = rec; PROV = prov; DAILY = daily;

  if (meta.updated) document.getElementById('upd-lbl').textContent = 'Act: ' + meta.updated;

  buildSidebar();
  document.getElementById('loading').style.display = 'none';
  render();
}

// ────────────────────────────────────────────────────
// SIDEBAR BUILD
// ────────────────────────────────────────────────────
function buildSidebar() {
  const E = REC.enums;
  const allMonths = REC.months; // [{y,m,label}]

  // Years
  const years = [...new Set(allMonths.map(m=>m.y))].sort();
  const yc = document.getElementById('f-years');
  years.forEach(y => {
    const b = btn(y, y, 'on', () => toggleChip('years', y, b, onFilterChange), false);
    yc.appendChild(b);
  });
  years.forEach(y => F.years.add(y)); // default: all selected

  // Month range
  const fs = document.getElementById('f-from'), ts = document.getElementById('f-to');
  allMonths.forEach(m => {
    const v = `${m.y}-${String(m.m).padStart(2,'0')}`;
    const lbl = `${MONTHS_ES[m.m].slice(0,3)} ${m.y}`;
    fs.append(new Option(lbl, v));
    ts.append(new Option(lbl, v));
  });

  // Canal
  const cc = document.getElementById('f-canales');
  ['Private','Corporate','RAC'].forEach((c,i) => {
    const cls = i===1?'c-corp':i===2?'c-rac':'';
    const b = btn(c, c, 'on '+cls, () => toggleChip('canales', i, b, onFilterChange), false);
    b.textContent = c;
    cc.appendChild(b);
    F.canales.add(i);
  });

  // Fuel
  const fc = document.getElementById('f-fuels');
  ['ICE','BEV','PHEV'].forEach((f,i) => {
    const cls = i===0?'c-ice':i===1?'c-bev':'c-phev';
    const b = btn(f, f, 'on '+cls, () => toggleChip('fuels', i, b, onFilterChange), false);
    fc.appendChild(b);
    F.fuels.add(i);
  });

  // Segment
  const sc = document.getElementById('f-segs');
  const segs = SEG_ORDER.filter(s => E.seg.includes(s));
  segs.forEach(s => {
    const idx = E.seg.indexOf(s);
    const b = btn(s, s, '', () => toggleChip('segs', idx, b, onFilterChange), false);
    sc.appendChild(b);
  });

  // SubSegmento
  const subc = document.getElementById('f-subs');
  ['REST','FOCUS SEGMENT'].forEach(s => {
    const idx = E.sub.indexOf(s);
    if (idx < 0) return;
    const lbl = s === 'FOCUS SEGMENT' ? 'Focus' : 'REST';
    const b = btn(lbl, s, '', () => toggleChip('subs', idx, b, onFilterChange), false);
    subc.appendChild(b);
  });

  // Body type
  const bc = document.getElementById('f-bodies');
  const bodies = E.body.map((b,i)=>({b,i})).filter(x=>x.b).sort((a,b)=>a.b.localeCompare(b.b));
  bodies.forEach(({b,i}) => {
    const btn2 = btn(b, b, '', () => toggleChip('bodies', i, btn2, onFilterChange), false);
    bc.appendChild(btn2);
  });

  // High Performance
  const hc = document.getElementById('f-hps');
  const hps = E.hp.map((h,i)=>({h,i})).filter(x=>x.h).sort((a,b)=>a.h.localeCompare(b.h));
  hps.forEach(({h,i}) => {
    const lbl = h === 'M Performance' ? 'M Perf' : h;
    const b = btn(lbl, h, h!=='Standard'?'c-hp':'', () => toggleChip('hps', i, b, onFilterChange), false);
    hc.appendChild(b);
  });

  // Brand/Model search-select
  buildSS('marca', E.marca, 'f-marca-q', 'ss-marca-list', 'marcas', 'f-marca-badge');
  buildSS('modelo', E.modelo, 'f-modelo-q', 'ss-modelo-list', 'modelos', 'f-modelo-badge');
}

function btn(label, val, cls, cb, isOn) {
  const el = document.createElement('button');
  el.className = 'chip' + (cls ? ' '+cls : '') + (isOn?' on':'');
  el.textContent = label;
  el.dataset.val = val;
  el.addEventListener('mousedown', e => { e.preventDefault(); cb(); });
  return el;
}

function toggleChip(key, val, el, cb) {
  if (F[key].has(val)) { F[key].delete(val); el.classList.remove('on'); }
  else                  { F[key].add(val);    el.classList.add('on'); }
  cb();
}

// Search-select component
const ssState = {};
function buildSS(id, items, inputId, listId, fKey, badgeId) {
  ssState[id] = { items, inputId, listId, fKey, badgeId, open: false };
  renderSSList(id, '');
}

function openSS(id) {
  ssState[id].open = true;
  document.getElementById(ssState[id].listId).classList.add('open');
}
function blurSS(id) {
  setTimeout(() => {
    ssState[id].open = false;
    document.getElementById(ssState[id].listId).classList.remove('open');
  }, 200);
}
function filterSS(id) {
  renderSSList(id, document.getElementById(ssState[id].inputId).value);
}
function renderSSList(id, q) {
  const { items, listId, fKey } = ssState[id];
  const list = document.getElementById(listId);
  list.innerHTML = '';
  const ql = q.toLowerCase();

  // For models: only show models that appear in selected brands
  let eligible = items;
  if (id === 'modelo' && F.marcas.size > 0 && F.marcas.size < REC.enums.marca.length) {
    const brandSet = F.marcas;
    const modelSet = new Set();
    REC.rows.forEach(r => { if (brandSet.has(r[COL.MARCA])) modelSet.add(r[COL.MODELO]); });
    eligible = items.filter((_,i) => modelSet.has(i));
  }

  const filtered = eligible.map((item,i)=>({item,i}))
    .filter(x => x.item && x.item.toLowerCase().includes(ql))
    .slice(0, 80);

  filtered.forEach(({item, i}) => {
    const d = document.createElement('div');
    d.className = 'ss-opt' + (F[fKey].has(i) ? ' sel' : '');
    d.textContent = item;
    d.onmousedown = (e) => { e.preventDefault(); toggleSS(id, i); };
    list.appendChild(d);
  });

  if (!filtered.length) {
    const d = document.createElement('div');
    d.className = 'ss-opt'; d.textContent = '(sin resultados)'; d.style.color='var(--text2)';
    list.appendChild(d);
  }
  list.classList.toggle('open', ssState[id].open || q.length > 0);
}

function toggleSS(id, idx) {
  const { fKey, badgeId } = ssState[id];
  if (F[fKey].has(idx)) F[fKey].delete(idx);
  else                   F[fKey].add(idx);
  renderSSList(id, document.getElementById(ssState[id].inputId).value);
  const n = F[fKey].size;
  document.getElementById(badgeId).textContent = n ? `(${n})` : '';
  // When brand changes, refresh model list
  if (id === 'marca') renderSSList('modelo', document.getElementById(ssState['modelo'].inputId).value);
  onFilterChange();
}

// ────────────────────────────────────────────────────
// FILTER ENGINE
// ────────────────────────────────────────────────────
function applyFilters() {
  if (!REC) return [];
  const from = F.fromYM, to = F.toYM;
  return REC.rows.filter(r => {
    if (F.years.size  && !F.years.has(r[COL.Y]))    return false;
    if (F.canales.size && !F.canales.has(r[COL.CANAL])) return false;
    if (F.fuels.size   && !F.fuels.has(r[COL.FUEL]))    return false;
    if (F.marcas.size  && !F.marcas.has(r[COL.MARCA]))  return false;
    if (F.modelos.size && !F.modelos.has(r[COL.MODELO])) return false;
    if (F.segs.size    && !F.segs.has(r[COL.SEG]))      return false;
    if (F.subs.size    && !F.subs.has(r[COL.SUB]))      return false;
    if (F.hps.size     && !F.hps.has(r[COL.HP]))        return false;
    if (F.bodies.size  && !F.bodies.has(r[COL.BODY]))   return false;
    // Month range
    if (from || to) {
      const ym = `${r[COL.Y]}-${String(r[COL.M]).padStart(2,'0')}`;
      if (from && ym < from) return false;
      if (to   && ym > to)   return false;
    }
    return true;
  });
}

function onFilterChange() {
  // Sync month range from selects
  F.fromYM = document.getElementById('f-from').value || null;
  F.toYM   = document.getElementById('f-to').value   || null;
  render();
}

function resetFilters() {
  // All years on
  F.years.clear();
  document.querySelectorAll('#f-years .chip').forEach(b => {
    b.classList.add('on'); F.years.add(Number(b.dataset.val));
  });
  // All canales on
  F.canales.clear();
  document.querySelectorAll('#f-canales .chip').forEach((b,i) => {
    b.classList.add('on'); F.canales.add(i);
  });
  // All fuels on
  F.fuels.clear();
  document.querySelectorAll('#f-fuels .chip').forEach((b,i) => {
    b.classList.add('on'); F.fuels.add(i);
  });
  // All segs/subs/bodies/hps off (= all allowed)
  ['f-segs','f-subs','f-bodies','f-hps'].forEach(id => {
    document.querySelectorAll(`#${id} .chip`).forEach(b => b.classList.remove('on'));
  });
  F.segs.clear(); F.subs.clear(); F.bodies.clear(); F.hps.clear();
  // Brand/model clear
  F.marcas.clear(); F.modelos.clear();
  ['marca','modelo'].forEach(id => {
    ssState[id]&&ssState[id].fKey&&(F[ssState[id].fKey]=new Set());
    const bi = document.getElementById(ssState[id]?.inputId);
    if(bi) bi.value='';
    const ba = document.getElementById(ssState[id]?.badgeId);
    if(ba) ba.textContent='';
    renderSSList(id,'');
  });
  F.marcas = new Set(); F.modelos = new Set();
  // Month range
  document.getElementById('f-from').value = '';
  document.getElementById('f-to').value = '';
  F.fromYM = null; F.toYM = null;
  onFilterChange();
}

// ────────────────────────────────────────────────────
// CHARTS HELPERS
// ────────────────────────────────────────────────────
const PALETTE = ['#4f8ef7','#00d4aa','#f7934f','#c084fc','#ffd700','#ff6b6b','#2ed573','#a78bfa','#38bdf8','#fb923c'];

function makeChart(id, type, data, opts={}) {
  if (charts[id]) { charts[id].destroy(); }
  const ctx = document.getElementById(id);
  if (!ctx) return;
  charts[id] = new Chart(ctx, {
    type, data,
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels:{ color:'#8892b0',font:{size:11} } } },
      scales: type==='bar'||type==='line' ? {
        x:{ ticks:{color:'#8892b0',font:{size:10}}, grid:{color:'rgba(42,58,92,.4)'} },
        y:{ ticks:{color:'#8892b0',font:{size:10}}, grid:{color:'rgba(42,58,92,.4)'},
            beginAtZero:true }
      } : {},
      ...opts,
    }
  });
}

function fmt(n) {
  if (n >= 1e6) return (n/1e6).toFixed(1)+'M';
  if (n >= 1e3) return (n/1e3).toFixed(n>=1e5?0:1)+'k';
  return n.toString();
}
function pct(n,d) { return d ? (100*n/d).toFixed(1)+'%' : '—'; }
function num(n) { return n.toLocaleString('es-ES'); }

// PAGES

const PAGE_LABELS = {mercado:'Mercado',marcas:'Marcas',segmentos:'Segmentos',modelos:'Modelos',provincias:'Provincias',diario:'MTD Diario'};
function setPage(name) {
  currentPage = name;
  document.querySelectorAll('.nb').forEach(b => b.classList.toggle('on', b.textContent===PAGE_LABELS[name]));
  document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
  document.getElementById('page-'+name).style.display = '';
  render();
}

function render() {
  const rows = applyFilters();
  if (currentPage==='mercado')    renderMercado(rows);
  else if (currentPage==='marcas')     renderMarcas(rows);
  else if (currentPage==='segmentos')  renderSegmentos(rows);
  else if (currentPage==='modelos')    renderModelos(rows);
  else if (currentPage==='provincias') renderProvincias();
  else if (currentPage==='diario')     renderDiario();
}

// ─── MARCAS ─────────────────────────────────────────
let marcaSort = {col:'total', dir:-1};
let marcaSearch = '';
function renderMarcas(rows) {
  const E = REC.enums;
  const el = document.getElementById('page-marcas');

  // Aggregate by brand
  const bm = {};
  rows.forEach(r => {
    const b = r[COL.MARCA];
    if (!bm[b]) bm[b] = {name:E.marca[b],total:0,c:[0,0,0],f:[0,0,0]};
    bm[b].total += r[COL.N];
    bm[b].c[r[COL.CANAL]] += r[COL.N];
    bm[b].f[r[COL.FUEL]]  += r[COL.N];
  });
  const total = rows.reduce((s,r)=>s+r[COL.N],0);
  let brands = Object.values(bm);
  if (marcaSearch) brands = brands.filter(b=>b.name.toLowerCase().includes(marcaSearch.toLowerCase()));
  const getV = (x,col) => col.startsWith('c') ? x.c[+col[1]]||0 : col.startsWith('f') ? x.f[+col[1]]||0 : x[col]||0;
  brands.sort((a,b) => getV(a,marcaSort.col) < getV(b,marcaSort.col) ? marcaSort.dir : -marcaSort.dir);
  const maxT = brands[0]?.total || 1;

  const thH = (col, lbl) => `<th onclick="sortMarcas('${col}')">${lbl}</th>`;

  el.innerHTML = `
  <div class="tw">
    <div class="th">
      <div class="th-t">Ranking Marcas (${brands.length})</div>
      <input class="ts" placeholder="Buscar…" value="${marcaSearch}"
        oninput="marcaSearch=this.value;renderMarcas(applyFilters())">
    </div>
    <table>
      <thead><tr>
        <th>#</th>
        ${thH('name','Marca')} ${thH('total','Total')} ${thH('c0','Private')} ${thH('c1','Corporativo')} ${thH('c2','RAC')}
        ${thH('f0','ICE')} ${thH('f1','BEV')} ${thH('f2','PHEV')} <th>% Mkt</th>
      </tr></thead>
      <tbody>
      ${brands.map((b,i)=>`<tr>
        <td>${i+1}</td>
        <td><b>${b.name}</b></td>
        <td><div class="bar-cell"><div class="bar-track"><div class="bar-fill" style="width:${(b.total/maxT*100).toFixed(0)}%"></div></div>${num(b.total)}</div></td>
        <td>${num(b.c[0])}</td><td>${num(b.c[1])}</td><td>${num(b.c[2])}</td>
        <td>${num(b.f[0])}</td><td style="color:var(--bev)">${num(b.f[1])}</td><td style="color:var(--phev)">${num(b.f[2])}</td>
        <td>${pct(b.total,total)}</td>
      </tr>`).join('')}
      </tbody>
    </table>
  </div>`;

  el.querySelectorAll('th').forEach(th => {
    const col = th.getAttribute('onclick')?.match(/'(.+)'/)?.[1];
    if (col === marcaSort.col) th.className = marcaSort.dir < 0 ? 'desc' : 'asc';
  });
}
function sortMarcas(col) {
  if (marcaSort.col===col) marcaSort.dir *= -1; else { marcaSort.col=col; marcaSort.dir=-1; }
  renderMarcas(applyFilters());
}

      brand:E.marca[r[COL.MARCA]], model:E.modelo[r[COL.MODELO]]||'—',

      seg:E.seg[r[COL.SEG]]||'', body:E.body[r[COL.BODY]]||'', hp:E.hp[r[COL.HP]]||''

    mm[key].total += r[COL.N];
    mm[key].c[r[COL.CANAL]] += r[COL.N];

  let models = Object.values(mm);
