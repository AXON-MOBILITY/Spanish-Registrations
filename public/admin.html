<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Axon Mobility — Administración de accesos</title>
<style>
  :root{
    --bg:#F2F4F7; --card:#FFFFFF; --border:rgba(0,0,0,.10); --acc:#2563EB;
    --text:#111827; --text2:#6b7280; --ok:#047857; --warn:#b45309; --bad:#b91c1c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  a{color:var(--acc)}
  header{display:flex;align-items:baseline;gap:12px;padding:18px 24px;border-bottom:1px solid var(--border);background:var(--card)}
  header h1{font-size:1.05rem;margin:0}
  header .sub{color:var(--text2);font-size:.82rem}
  header .spacer{flex:1}
  main{max-width:1240px;margin:0 auto;padding:22px 24px 60px}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:20px}
  .panel h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text2);margin:0 0 14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
  label{display:block;font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;color:var(--text2);margin-bottom:5px}
  input,select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);font:inherit}
  input:focus,select:focus{outline:none;border-color:var(--acc)}
  button{font:inherit;border:none;border-radius:8px;padding:8px 14px;cursor:pointer;background:var(--acc);color:#fff;font-weight:600}
  button.ghost{background:#fff;border:1px solid var(--border);color:var(--text);font-weight:500}
  button.danger{background:#fff;border:1px solid var(--bad);color:var(--bad);font-weight:500}
  button:disabled{opacity:.5;cursor:default}
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:.86rem}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top}
  th{font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;color:var(--text2);position:sticky;top:0;background:var(--card)}
  tbody tr:hover{background:#f8fafc}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.72rem;font-weight:600}
  .pill.active{background:#ecfdf5;color:var(--ok)}
  .pill.expiring{background:#fffbeb;color:var(--warn)}
  .pill.expired,.pill.revoked{background:#fef2f2;color:var(--bad)}
  .pill.admin{background:#eef2ff;color:var(--acc)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .cred{display:inline-flex;align-items:center;gap:6px}
  .cred code{background:#f1f5f9;padding:2px 6px;border-radius:6px}
  .row-actions{display:flex;flex-wrap:wrap;gap:6px}
  .row-actions button{padding:4px 9px;font-size:.76rem}
  .muted{color:var(--text2)}
  .msg{padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:.86rem;display:none}
  .msg.err{display:block;background:#fef2f2;color:var(--bad);border:1px solid #fecaca}
  .msg.ok{display:block;background:#ecfdf5;color:var(--ok);border:1px solid #a7f3d0}
  .gate{max-width:440px;margin:14vh auto;text-align:center;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:34px}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .toolbar input{max-width:240px}
  .count{color:var(--text2);font-size:.8rem}
</style>
</head>
<body>

<div id="app" hidden>
  <header>
    <h1>Administración de accesos</h1>
    <span class="sub">registrations.axon-mobility.com</span>
    <span class="spacer"></span>
    <span class="sub" id="who"></span>
    <button class="ghost" id="btn-refresh" type="button">Refrescar</button>
  </header>

  <main>
    <div class="msg" id="msg"></div>

    <div class="panel">
      <h2>Nuevo acceso</h2>
      <div class="grid">
        <div>
          <label for="f-user">Usuario</label>
          <input id="f-user" placeholder="cliente-demo" autocomplete="off">
        </div>
        <div>
          <label for="f-kind">Tipo</label>
          <select id="f-kind">
            <option value="temporary">Temporal</option>
            <option value="permanent">Permanente</option>
          </select>
        </div>
        <div id="wrap-expiry">
          <label for="f-expiry">Caduca</label>
          <input id="f-expiry" type="date">
        </div>
        <div>
          <label for="f-org">Organización</label>
          <select id="f-org"><option value="">— sin organización (vista genérica)</option></select>
        </div>
        <div>
          <label for="f-note">Nota (opcional)</label>
          <input id="f-note" placeholder="contacto / motivo" autocomplete="off">
        </div>
        <div>
          <button id="btn-create" type="button">Crear acceso</button>
        </div>
      </div>
      <p class="muted" id="create-out" style="margin:12px 0 0"></p>
    </div>

    <div class="panel">
      <h2>Usuarios</h2>
      <div class="toolbar">
        <input id="q" placeholder="filtrar usuario / organización…">
        <label style="display:flex;gap:6px;align-items:center;text-transform:none;letter-spacing:0;margin:0;font-size:.82rem;color:var(--text)">
          <input type="checkbox" id="only-temp" style="width:auto"> solo temporales
        </label>
        <span class="spacer" style="flex:1"></span>
        <span class="count" id="count"></span>
      </div>
      <div style="overflow-x:auto">
      <table>
        <thead><tr>
          <th>Usuario</th><th>Org</th><th>Alta</th><th>Días en uso</th>
          <th>Último acceso</th><th>Estado</th><th>Caduca</th><th>Contraseña</th><th></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
      </div>
    </div>
  </main>
</div>

<div id="gate" class="gate" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function(){
  const SUPABASE_URL='https://zuqlmglawucerayjrqam.supabase.co';
  const SUPABASE_ANON_KEY='sb_publishable_9_fkC1J3JcWiwO9UDLGoFg_aqnTNtMK';
  const sb=window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Mirror the access token into the cookie the Edge middleware checks so
  // /api/admin/* is reachable. Same scheme as index.html.
  function setSessionCookie(s){ if(s&&s.access_token) document.cookie='sb-access-token='+s.access_token+'; Path=/; Secure; SameSite=Lax; Max-Age=3600'; }
  (function prime(){ try{
    const ref=SUPABASE_URL.split('//')[1].split('.')[0];
    const raw=localStorage.getItem('sb-'+ref+'-auth-token'); if(!raw) return;
    const s=JSON.parse(raw); const sess=(s&&s.access_token)?s:(s&&s.currentSession)||null;
    if(sess&&sess.access_token&&!(sess.expires_at&&sess.expires_at*1000<=Date.now())) setSessionCookie(sess);
  }catch(e){} })();
  sb.auth.onAuthStateChange((_e,s)=>{ if(s) setSessionCookie(s); });

  const $=id=>document.getElementById(id);
  const gate=$('gate'), app=$('app');
  let TOKEN=null, USERS=[], ORGS=[];

  function showGate(html){ gate.innerHTML=html; gate.hidden=false; app.hidden=true; }
  function fmtDate(s){ if(!s) return '—'; const d=new Date(s); return isNaN(d)?'—':d.toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'}); }
  function fmtWhen(s){ if(!s) return 'nunca'; const d=new Date(s); if(isNaN(d)) return '—';
    const days=Math.floor((Date.now()-d)/86400000);
    if(days<=0) return 'hoy'; if(days===1) return 'ayer'; if(days<30) return 'hace '+days+' d'; return fmtDate(s); }
  function msg(text,kind){ const m=$('msg'); m.textContent=text; m.className='msg '+(kind||'ok'); if(kind!=='err') setTimeout(()=>{m.className='msg';},4000); }

  async function api(path, opts){
    const r=await fetch(path,Object.assign({headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOKEN}},opts||{}));
    // 401 = the admin-gate cookie or the Supabase session expired; reload so the
    // middleware unlock form / login gate shows again.
    if(r.status===401){ location.reload(); return new Promise(()=>{}); }
    let body=null; try{ body=await r.json(); }catch(e){}
    if(!r.ok) throw new Error((body&&body.error)||('HTTP '+r.status));
    return body;
  }

  function statusPill(u){
    const map={active:['active','Activo'],expiring:['expiring','Activo'],expired:['expired','Caducado'],
      revoked:['revoked','Revocado'],admin:['admin','Admin']};
    const [cls,label]=map[u.status]||['active',u.status];
    return '<span class="pill '+cls+'">'+label+'</span>';
  }
  function expiresCell(u){
    if(u.kind!=='temporary'||!u.expires_at) return '<span class="muted">permanente</span>';
    const d=u.days_left;
    if(d===null) return '—';
    if(d<0) return '<span style="color:var(--bad)">caducó '+fmtDate(u.expires_at)+'</span>';
    if(d<=3) return '<span style="color:var(--warn)">'+fmtDate(u.expires_at)+' · '+d+' d</span>';
    return fmtDate(u.expires_at)+' · '+d+' d';
  }
  function credCell(u){
    if(u.is_platform_admin) return '<span class="muted">—</span>';
    if(!u.password) return '<span class="muted">no registrada</span>';
    return '<span class="cred"><code class="mono">'+esc(u.password)+'</code>'
      +'<button class="ghost" data-copy="'+esc(u.username)+' / '+esc(u.password)+'">copiar</button></span>';
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function rowActions(u){
    if(u.is_platform_admin) return '<span class="muted">protegido</span>';
    const b=[];
    b.push('<button class="ghost" data-act="reset_password" data-id="'+u.user_id+'">resetear</button>');
    if(u.kind==='temporary'){
      b.push('<button class="ghost" data-act="extend" data-id="'+u.user_id+'">extender</button>');
      b.push('<button class="ghost" data-act="make_permanent" data-id="'+u.user_id+'">hacer permanente</button>');
    }
    if(u.status!=='revoked') b.push('<button class="danger" data-act="revoke" data-id="'+u.user_id+'">revocar</button>');
    b.push('<button class="danger" data-act="delete" data-id="'+u.user_id+'">borrar</button>');
    return '<div class="row-actions">'+b.join('')+'</div>';
  }

  function render(){
    const q=$('q').value.trim().toLowerCase();
    const onlyTemp=$('only-temp').checked;
    const list=USERS.filter(u=>{
      if(onlyTemp && u.kind!=='temporary') return false;
      if(!q) return true;
      return (u.username||'').toLowerCase().includes(q) || (u.org||'').toLowerCase().includes(q) || (u.note||'').toLowerCase().includes(q);
    });
    $('count').textContent=list.length+' de '+USERS.length;
    $('rows').innerHTML=list.map(u=>'<tr>'
      +'<td><strong>'+esc(u.username)+'</strong>'+(u.note?'<br><span class="muted">'+esc(u.note)+'</span>':'')+'</td>'
      +'<td>'+(u.org?esc(u.org):'<span class="muted">—</span>')+'</td>'
      +'<td>'+fmtDate(u.created_at)+'</td>'
      +'<td>'+(u.days_in_use==null?'—':u.days_in_use+' d')+'</td>'
      +'<td>'+fmtWhen(u.last_sign_in_at)+'</td>'
      +'<td>'+statusPill(u)+'</td>'
      +'<td>'+expiresCell(u)+'</td>'
      +'<td>'+credCell(u)+'</td>'
      +'<td>'+rowActions(u)+'</td>'
      +'</tr>').join('') || '<tr><td colspan="9" class="muted">Sin resultados</td></tr>';
  }

  async function load(){
    const data=await api('/api/admin/users');
    USERS=data.users||[]; ORGS=data.orgs||[];
    const sel=$('f-org');
    sel.innerHTML='<option value="">— sin organización (vista genérica)</option>'
      +ORGS.map(o=>'<option value="'+esc(o.slug)+'">'+esc(o.display_name)+'</option>').join('');
    render();
  }

  async function doAction(act,id){
    const u=USERS.find(x=>x.user_id===id); if(!u) return;
    let payload={action:act,user_id:id};
    if(act==='extend'){
      const def=new Date(Date.now()+14*86400000).toISOString().slice(0,10);
      const v=prompt('Nueva fecha de caducidad (AAAA-MM-DD):',u.expires_at?u.expires_at.slice(0,10):def);
      if(!v) return; payload.expires_at=new Date(v+'T23:59:59').toISOString();
    }
    if(act==='revoke' && !confirm('Revocar el acceso de "'+u.username+'"? No podrá entrar.')) return;
    if(act==='delete' && !confirm('BORRAR la cuenta "'+u.username+'" por completo? Irreversible.')) return;
    try{
      const r=await api('/api/admin/user-actions',{method:'POST',body:JSON.stringify(payload)});
      if(r.password) msg('Nueva contraseña de '+r.username+': '+r.password+'  (cópiala ahora)','ok');
      else msg('Hecho.','ok');
      await load();
    }catch(e){ msg('Error: '+e.message,'err'); }
  }

  async function create(){
    const btn=$('btn-create'); const out=$('create-out');
    const body={
      username:$('f-user').value.trim().toLowerCase(),
      kind:$('f-kind').value,
      org_slug:$('f-org').value||undefined,
      note:$('f-note').value.trim()||undefined,
    };
    if(body.kind==='temporary'){
      const d=$('f-expiry').value;
      if(!d){ msg('Elige una fecha de caducidad.','err'); return; }
      body.expires_at=new Date(d+'T23:59:59').toISOString();
    }
    btn.disabled=true; out.textContent='';
    try{
      const r=await api('/api/admin/users',{method:'POST',body:JSON.stringify(body)});
      out.innerHTML='Creado. <strong>Usuario:</strong> <code class="mono">'+esc(r.username)+'</code> '
        +'<strong>Contraseña:</strong> <code class="mono">'+esc(r.password)+'</code> '
        +'<button class="ghost" data-copy="'+esc(r.username)+' / '+esc(r.password)+'">copiar</button>'
        +'<br><span class="muted">Se guarda cifrada; podrás volver a verla en la tabla.</span>';
      $('f-user').value=''; $('f-note').value='';
      await load();
    }catch(e){ msg('Error: '+e.message,'err'); }
    btn.disabled=false;
  }

  document.addEventListener('click',function(e){
    const c=e.target.closest('[data-copy]');
    if(c){ navigator.clipboard.writeText(c.getAttribute('data-copy')); c.textContent='copiado'; setTimeout(()=>c.textContent='copiar',1200); return; }
    const a=e.target.closest('[data-act]');
    if(a){ doAction(a.getAttribute('data-act'), a.getAttribute('data-id')); }
  });
  $('f-kind').addEventListener('change',function(){ $('wrap-expiry').style.display=this.value==='temporary'?'':'none'; });
  $('q').addEventListener('input',render);
  $('only-temp').addEventListener('change',render);
  $('btn-refresh').addEventListener('click',()=>load().catch(e=>msg('Error: '+e.message,'err')));
  $('btn-create').addEventListener('click',create);
  $('f-expiry').value=new Date(Date.now()+14*86400000).toISOString().slice(0,10);

  (async function boot(){
    const { data:{ session } } = await sb.auth.getSession();
    if(!session){
      showGate('<h2 style="margin:0 0 10px">Sesión requerida</h2>'
        +'<p class="muted">Inicia sesión en el panel principal y vuelve aquí.</p>'
        +'<p><a href="/">Ir a registrations.axon-mobility.com</a></p>');
      return;
    }
    setSessionCookie(session);
    TOKEN=session.access_token;
    $('who').textContent=(session.user.email||'').split('@')[0];
    try{
      await load();
      app.hidden=false; gate.hidden=true;
    }catch(e){
      if(String(e.message).indexOf('403')>-1 || /platform admin/i.test(e.message)){
        showGate('<h2 style="margin:0 0 10px">Sin permiso</h2>'
          +'<p class="muted">Tu cuenta no es administrador de plataforma. Pídele a un admin que te añada a <code>platform_admins</code>.</p>'
          +'<p><a href="/">Volver</a></p>');
      } else {
        showGate('<h2 style="margin:0 0 10px">Error</h2><p class="muted">'+esc(e.message)+'</p><p><a href="/">Volver</a></p>');
      }
    }
  })();
})();
</script>
</body>
</html>
