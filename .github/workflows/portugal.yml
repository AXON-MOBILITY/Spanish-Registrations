name: Portugal ACAP monthly

on:
  workflow_dispatch:
  schedule:
    # Dia 3 y dia 6 de cada mes (ACAP publica a primeros de mes)
    - cron: "30 8 3 * *"
    - cron: "30 8 6 * *"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install openpyxl

      - name: Fetch ACAP Portugal
        run: python scripts/fetch_portugal_acap.py

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/portugal/ || true
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "Portugal: snapshot mensual ACAP [skip ci]"
          git push
