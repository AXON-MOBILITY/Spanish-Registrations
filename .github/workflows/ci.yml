name: CI

on:
  push:
    branches: [main, master]
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"
      - "requirements.txt"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m pytest tests/ -q

      - name: Smoke build dashboard data
        run: python scripts/build_dashboard_data.py

      - name: Run temporary BMW postcode pilot
        run: |
          python scripts/audit_bmw_postcode_proxy.py \
            --yyyymm 202606 \
            --out-dir pilot-output

      - uses: actions/upload-artifact@v4
        with:
          name: bmw-postcode-pilot-202606
          path: pilot-output/
          if-no-files-found: error
