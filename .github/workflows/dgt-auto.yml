name: DGT auto sync

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo: auto (diario+MTD), all (todos los meses históricos)"
        required: false
        default: "auto"
        type: choice
        options:
          - "auto"
          - "all"
      force:
        description: Forzar reprocesado aunque ya exista el CSV
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  schedule:
    # GitHub Actions usa UTC. La DGT publica con horario variable y los
    # schedules de GitHub pueden retrasarse o saltarse; dejamos varias ventanas
    # horarias sin hacer polling excesivo. En schedule no usamos --force, asi
    # que si no hay fichero nuevo termina sin commit tras saltar los ya procesados.
    - cron: "15 7-12,14,16 * * *"

permissions:
  contents: write

concurrency:
  group: dgt-auto-sync
  cancel-in-progress: false

env:
  # 1 = modo legado: alinea 2026 al ultimo export Simmix.
  # 0 = modo independiente: publica la ETL propia; Simmix solo auditoría/drift.
  SIMMIX_ALIGN: "0"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        shell: bash
        run: pip install -r requirements.txt

      - name: Run unit tests (gate)
        shell: bash
        run: python -m pytest tests/ -q

      - name: Run DGT sync
        shell: bash
        run: |
          set -euo pipefail
          MODE="${{ inputs.mode || 'auto' }}"
          FORCE="${{ inputs.force || 'false' }}"
          FORCE_FLAG=""
          if [ "$FORCE" = "true" ]; then FORCE_FLAG="--force"; fi
          if [ "$MODE" = "all" ]; then
            echo "Modo: reprocesar TODOS los meses históricos"
            python scripts/process_month.py all $FORCE_FLAG
          else
            echo "Modo: auto (diario + mensual 2026)"
            python scripts/process_month.py auto $FORCE_FLAG
          fi

      - name: Verify latest DGT daily was processed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import sys
          sys.path.insert(0, "scripts")
          import process_month as pm

          links = pm.discover_daily_links()
          if not links:
              raise SystemExit("No se encontraron enlaces diarios DGT")
          latest = links[-1][0]
          path = os.path.join("data", "processed", f"dgt_canal_daily_{latest}.csv")
          if not os.path.exists(path) or os.path.getsize(path) == 0:
              raise SystemExit(f"DGT publico {latest}, pero no se genero {path}")
          print(f"Ultimo diario DGT procesado: {latest} ({path})")
          PY

      - name: Build dashboard data
        shell: bash
        run: python scripts/build_dashboard_data.py

      - name: Commit generated outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/ public/ || true
          if git diff --cached --quiet; then
            echo "No hay cambios que commitear."
            exit 0
          fi
          git commit -m "Update DGT matriculaciones outputs [skip ci]"
          git push
