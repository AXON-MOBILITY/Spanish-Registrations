name: BMW postcode pilot

on:
  push:
    branches:
      - codex/dealer-feasibility

permissions:
  contents: read

jobs:
  postcode-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run June 2026 postcode pilot
        run: |
          python scripts/audit_bmw_postcode_proxy.py \
            --yyyymm 202606 \
            --out-dir pilot-output

      - uses: actions/upload-artifact@v4
        with:
          name: bmw-postcode-pilot-202606
          path: pilot-output/
          if-no-files-found: error
